<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 20px;
  }

  .card {
    background: #fff;
    width: 100%;
    max-width: 440px;
    padding: 32px 28px;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }

  h1 {
    font-size: 1.6rem;
    color: #2d2d44;
    text-align: center;
    margin-bottom: 6px;
  }

  .sub {
    text-align: center;
    color: #888;
    font-size: .85rem;
    margin-bottom: 24px;
  }

  label {
    display: block;
    font-size: .85rem;
    font-weight: 600;
    color: #444;
    margin-bottom: 8px;
  }

  input[type="date"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 1rem;
    border: 2px solid #e0e0e8;
    border-radius: 10px;
    outline: none;
    transition: border-color .2s;
    color: #2d2d44;
    background: #fafaff;
  }

  input[type="date"]:focus { border-color: #667eea; background: #fff; }

  button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }

  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,.45); }
  button:active { transform: translateY(0); }

  .error {
    margin-top: 14px;
    padding: 11px;
    background: #ffecec;
    color: #d32f2f;
    border-radius: 8px;
    font-size: .85rem;
    text-align: center;
    display: none;
  }

  .result { display: none; margin-top: 24px; }

  .main-age {
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, #f4f5ff, #eef0ff);
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .main-age .big {
    font-size: 2.1rem;
    font-weight: 800;
    color: #5a3fa8;
    line-height: 1.3;
  }

  .main-age .small {
    font-size: .8rem;
    color: #888;
    margin-top: 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .box {
    background: #f8f8fd;
    border: 1px solid #ececf5;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }

  .box .val { font-size: 1.15rem; font-weight: 700; color: #2d2d44; }
  .box .lbl { font-size: .72rem; color: #8a8aa0; margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }

  .next-bday {
    margin-top: 12px;
    padding: 12px;
    text-align: center;
    background: #fff8e6;
    border: 1px solid #ffe3a3;
    border-radius: 10px;
    font-size: .88rem;
    color: #8a6100;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎂 Age Calculator</h1>
  <p class="sub">Apni date of birth select karein</p>

  <label for="dob">Date of Birth</label>
  <input type="date" id="dob">

  <button onclick="calculateAge()">Calculate Age</button>

  <div class="error" id="error"></div>

  <div class="result" id="result">
    <div class="main-age">
      <div class="big" id="mainAge">—</div>
      <div class="small">Your exact age</div>
    </div>

    <div class="grid">
      <div class="box"><div class="val" id="totalMonths">—</div><div class="lbl">Months</div></div>
      <div class="box"><div class="val" id="totalWeeks">—</div><div class="lbl">Weeks</div></div>
      <div class="box"><div class="val" id="totalDays">—</div><div class="lbl">Days</div></div>
      <div class="box"><div class="val" id="totalHours">—</div><div class="lbl">Hours</div></div>
    </div>

    <div class="next-bday" id="nextBday"></div>
  </div>
</div>

<script>
function calculateAge() {
  const dobInput  = document.getElementById('dob').value;
  const errorBox  = document.getElementById('error');
  const resultBox = document.getElementById('result');

  // Reset
  errorBox.style.display  = 'none';
  resultBox.style.display = 'none';

  // Validation
  if (!dobInput) {
    errorBox.textContent = '⚠️ Please apni date of birth select karein.';
    errorBox.style.display = 'block';
    return;
  }

  const dob   = new Date(dobInput);
  const today = new Date();

  // Future date check
  if (dob > today) {
    errorBox.textContent = '⚠️ Date of birth future ki nahi ho sakti!';
    errorBox.style.display = 'block';
    return;
  }

  // ---------- Years / Months / Days ----------
  let years  = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth()    - dob.getMonth();
  let days   = today.getDate()     - dob.getDate();

  if (days < 0) {
    months--;
    // Pichle mahine ke total din
    const daysInPrevMonth = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    days += daysInPrevMonth;
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  // ---------- Totals ----------
  const diffMs     = today - dob;
  const totalDays  = Math.floor(diffMs / 86400000);
  const totalWeeks = Math.floor(totalDays / 7);
  const totalMonths= years * 12 + months;
  const totalHours = Math.floor(diffMs / 3600000);

  // ---------- Next Birthday ----------
  let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
  if (nextBday < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
    nextBday.setFullYear(today.getFullYear() + 1);
  }
  const daysToBday = Math.ceil((nextBday - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);

  // ---------- Output ----------
  document.getElementById('mainAge').textContent =
    `${years} years, ${months} months, ${days} days`;

  document.getElementById('totalMonths').textContent = totalMonths.toLocaleString();
  document.getElementById('totalWeeks').textContent  = totalWeeks.toLocaleString();
  document.getElementById('totalDays').textContent   = totalDays.toLocaleString();
  document.getElementById('totalHours').textContent  = totalHours.toLocaleString();

  document.getElementById('nextBday').textContent =
    daysToBday === 0
      ? '🎉 Aaj aapka birthday hai! Happy Birthday!'
      : `🎈 Next birthday in ${daysToBday} day${daysToBday > 1 ? 's' : ''}`;

  resultBox.style.display = 'block';
}

// Enter key se bhi calculate ho jaye
document.getElementById('dob').addEventListener('keypress', e => {
  if (e.key === 'Enter') calculateAge();
});
</script>

</body>
</html>
